# Full stack for production / Dokploy (pull pre-built images; do not build on the VPS).
# Postgres is external: set DATABASE_URL to your managed DB or another container on the same Docker network.
#
# Images are built and pushed by GitHub Actions (see .github/workflows/ci.yml):
#   ghcr.io/<owner>/plansync-frontend:<tag>
#   ghcr.io/<owner>/plansync-backend:<tag>
#
# Usage (after images exist in GHCR and the host is logged in):
#   export DATABASE_URL="postgresql://user:pass@host:5432/plansync"
#   export PUBLIC_APP_URL=https://your-domain.example
#   export BETTER_AUTH_SECRET=...
#   docker compose -f docker-compose.deploy.yml pull
#   docker compose -f docker-compose.deploy.yml up -d
#
# Dokploy: set env in the UI (project or compose env). Traefik needs external network `dokploy-network`.
# Web Push: add VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT here so the `backend` service receives them (not only on `frontend`).
# Rollback: set FRONTEND_IMAGE_TAG / BACKEND_IMAGE_TAG to a prior git SHA (full 40-char) and redeploy.

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/abedaarabi/plansync-backend}:${BACKEND_IMAGE_TAG:-production}
    pull_policy: always
    restart: unless-stopped
    networks:
      - internal
      - dokploy-network
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-8787}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      CORS_ORIGIN: ${CORS_ORIGIN:-${PUBLIC_APP_URL:?set PUBLIC_APP_URL}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-${PUBLIC_APP_URL}}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-${NEXT_PUBLIC_API_URL:-}}
      BETTER_AUTH_COOKIE_DOMAIN: ${BETTER_AUTH_COOKIE_DOMAIN:-}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      MAX_DIRECT_UPLOAD_BYTES: ${MAX_DIRECT_UPLOAD_BYTES:-104857600}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_TEAM_MONTHLY: ${STRIPE_PRICE_TEAM_MONTHLY:-}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-}
      STRIPE_PRICE_ENTERPRISE_MONTHLY: ${STRIPE_PRICE_ENTERPRISE_MONTHLY:-}
      STRIPE_PRICE_TEAM_EXTRA_SEAT_MONTHLY: ${STRIPE_PRICE_TEAM_EXTRA_SEAT_MONTHLY:-}
      STRIPE_PRICE_PRO_EXTRA_SEAT_MONTHLY: ${STRIPE_PRICE_PRO_EXTRA_SEAT_MONTHLY:-}
      STRIPE_PRICE_ENTERPRISE_EXTRA_SEAT_MONTHLY: ${STRIPE_PRICE_ENTERPRISE_EXTRA_SEAT_MONTHLY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Project files → Import from cloud (OneDrive / Dropbox); optional
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      DROPBOX_APP_KEY: ${DROPBOX_APP_KEY:-}
      DROPBOX_APP_SECRET: ${DROPBOX_APP_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      # Sheet AI (Gemini) — optional; omit or leave empty to disable (503 "not configured")
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      # Web Push (VAPID) — optional; all three required for device alerts. Generate: `cd backend && npx web-push generate-vapid-keys`
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||8787)+'/',{headers:{Accept:'application/json'}}).then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.plansync-api.rule=Host(`${PUBLIC_API_HOST:-api.plansync.dev}`)"
      - "traefik.http.routers.plansync-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.plansync-api.service=plansync-api"
      - "traefik.http.services.plansync-api.loadbalancer.server.port=${BACKEND_PORT:-8787}"

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/abedaarabi/plansync-frontend}:${FRONTEND_IMAGE_TAG:-production}
    pull_policy: always
    restart: unless-stopped
    networks:
      - internal
      - dokploy-network
    depends_on:
      backend:
        condition: service_healthy
    # No host `ports:` — Traefik reaches this service on dokploy-network (see labels). Publishing
    # 3000:3000 conflicts with other stacks / Dokploy’s gateway on the same host.
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      API_PROXY_TARGET: http://backend:${BACKEND_PORT:-8787}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.plansync-web.rule=Host(`${PUBLIC_APP_HOST:-plansync.dev}`)"
      - "traefik.http.routers.plansync-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.plansync-web.service=plansync-web"
      - "traefik.http.services.plansync-web.loadbalancer.server.port=3000"
