name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/plansync-frontend
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/plansync-backend

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Prisma schema reads env("DATABASE_URL"); validate/generate do not open a DB.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/plansync
      # Next/webpack + PWA can OOM on the default ~2GB heap during CI.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # `npm ci` can omit Tailwind v4 Linux GNU bindings (they are absent from the lockfile).
      # Install into a temp prefix and copy in, so the workspace dependency tree is untouched.
      - name: Ensure Tailwind Linux native bindings
        run: |
          set -eu
          if [ -f node_modules/lightningcss/lightningcss.linux-x64-gnu.node ] \
            && [ -d node_modules/@tailwindcss/oxide-linux-x64-gnu ]; then
            echo "Linux Tailwind native bindings already present"
            exit 0
          fi
          LC_VER=$(node -p "require('./package-lock.json').packages['node_modules/lightningcss']?.version ?? ''")
          OX_VER=$(node -p "require('./package-lock.json').packages['node_modules/@tailwindcss/oxide']?.version ?? ''")
          if [ -z "$LC_VER" ] || [ -z "$OX_VER" ]; then
            echo "Could not read lightningcss / @tailwindcss/oxide versions from package-lock.json"
            exit 1
          fi
          NATIVES=$(mktemp -d)
          npm install --prefix "$NATIVES" --no-save --no-package-lock --no-audit --no-fund \
            "lightningcss-linux-x64-gnu@${LC_VER}" \
            "@tailwindcss/oxide-linux-x64-gnu@${OX_VER}"
          cp -R "$NATIVES/node_modules/lightningcss-linux-x64-gnu" node_modules/
          mkdir -p node_modules/@tailwindcss
          cp -R "$NATIVES/node_modules/@tailwindcss/oxide-linux-x64-gnu" node_modules/@tailwindcss/
          # `lightningcss` resolves the binary relative to its own package directory.
          cp node_modules/lightningcss-linux-x64-gnu/lightningcss.linux-x64-gnu.node \
            node_modules/lightningcss/lightningcss.linux-x64-gnu.node

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Prisma validate, format, generate
        run: npm run db:precommit

      - name: Build frontend
        run: npm run build -w @plansync/web

      - name: Build backend
        run: npm run build -w backend

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: check
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium
      - name: E2E smoke (toggle job if-condition to enable)
        run: cd frontend && npm run test:e2e

  changes:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - 'scripts/docker-npm-ci.sh'
            backend:
              - 'backend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - 'scripts/docker-npm-ci.sh'
            deploy:
              - 'frontend/**'
              - 'backend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - 'scripts/docker-npm-ci.sh'
              - 'docker-compose.deploy.yml'

  build-frontend:
    runs-on: ubuntu-latest
    needs: [check, changes]
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=production
            type=sha,format=long,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SOCIAL_AUTH=${{ vars.NEXT_PUBLIC_SOCIAL_AUTH }}
            NEXT_PUBLIC_SMART_UPLOAD_FLOW=${{ vars.NEXT_PUBLIC_SMART_UPLOAD_FLOW }}
            NEXT_PUBLIC_UMAMI_URL=${{ vars.NEXT_PUBLIC_UMAMI_URL }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
            API_PROXY_TARGET=http://backend:8787
          cache-from: type=gha,scope=plansync-frontend
          cache-to: type=gha,mode=max,scope=plansync-frontend

  build-backend:
    runs-on: ubuntu-latest
    needs: [check, changes]
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=production
            type=sha,format=long,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=plansync-backend
          cache-to: type=gha,mode=max,scope=plansync-backend

  deploy:
    runs-on: ubuntu-latest
    needs: [check, changes, build-frontend, build-backend]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.check.result == 'success' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.deploy == 'true' &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped') &&
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped')
    steps:
      - name: Require Dokploy webhook secret
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_WEBHOOK" ]; then
            echo "Missing repository secret DOKPLOY_DEPLOY_WEBHOOK."
            echo "Add the Dokploy compose deploy webhook URL, then re-run this workflow."
            exit 1
          fi

      - name: Trigger Dokploy pull-and-restart
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          curl --fail --silent --show-error \
            --request GET \
            --max-time 60 \
            "$DOKPLOY_DEPLOY_WEBHOOK"
          echo
          echo "Dokploy deploy webhook accepted."
