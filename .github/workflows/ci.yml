name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Build and push both images regardless of changed paths"
        type: boolean
        default: false
      deploy:
        description: "Trigger the Dokploy deploy webhook after the build"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/plansync-frontend
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/plansync-backend

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Prisma schema reads env("DATABASE_URL"); validate/generate do not open a DB.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/plansync
      # Next/webpack + PWA can OOM on the default ~2GB heap during CI.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # `npm ci` can omit Tailwind v4 Linux GNU bindings (they are absent from the lockfile).
      # Install into a temp prefix and copy in, so the workspace dependency tree is untouched.
      - name: Ensure Tailwind Linux native bindings
        run: |
          set -eu
          if [ -f node_modules/lightningcss/lightningcss.linux-x64-gnu.node ] \
            && [ -d node_modules/@tailwindcss/oxide-linux-x64-gnu ]; then
            echo "Linux Tailwind native bindings already present"
            exit 0
          fi
          LC_VER=$(node -p "require('./package-lock.json').packages['node_modules/lightningcss']?.version ?? ''")
          OX_VER=$(node -p "require('./package-lock.json').packages['node_modules/@tailwindcss/oxide']?.version ?? ''")
          if [ -z "$LC_VER" ] || [ -z "$OX_VER" ]; then
            echo "Could not read lightningcss / @tailwindcss/oxide versions from package-lock.json"
            exit 1
          fi
          NATIVES=$(mktemp -d)
          npm install --prefix "$NATIVES" --no-save --no-package-lock --no-audit --no-fund \
            "lightningcss-linux-x64-gnu@${LC_VER}" \
            "@tailwindcss/oxide-linux-x64-gnu@${OX_VER}"
          cp -R "$NATIVES/node_modules/lightningcss-linux-x64-gnu" node_modules/
          mkdir -p node_modules/@tailwindcss
          cp -R "$NATIVES/node_modules/@tailwindcss/oxide-linux-x64-gnu" node_modules/@tailwindcss/
          # `lightningcss` resolves the binary relative to its own package directory.
          cp node_modules/lightningcss-linux-x64-gnu/lightningcss.linux-x64-gnu.node \
            node_modules/lightningcss/lightningcss.linux-x64-gnu.node

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Prisma validate, format, generate
        run: npm run db:precommit

      - name: Build frontend
        run: npm run build -w @plansync/web

      - name: Build backend
        run: npm run build -w backend

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: check
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium
      - name: E2E smoke (toggle job if-condition to enable)
        run: cd frontend && npm run test:e2e

  changes:
    runs-on: ubuntu-latest
    needs: check
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    outputs:
      frontend: ${{ steps.filter.outputs.frontend || 'false' }}
      backend: ${{ steps.filter.outputs.backend || 'false' }}
      deploy: ${{ steps.filter.outputs.deploy || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - 'scripts/docker-npm-ci.sh'
            backend:
              - 'backend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - 'scripts/docker-npm-ci.sh'
            deploy:
              - 'frontend/**'
              - 'backend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - 'scripts/docker-npm-ci.sh'
              - 'docker-compose.deploy.yml'

  build-frontend:
    runs-on: ubuntu-latest
    needs: [check, changes]
    if: needs.changes.outputs.frontend == 'true' || inputs.force_build
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=production
            type=sha,format=long,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SOCIAL_AUTH=${{ vars.NEXT_PUBLIC_SOCIAL_AUTH }}
            NEXT_PUBLIC_SMART_UPLOAD_FLOW=${{ vars.NEXT_PUBLIC_SMART_UPLOAD_FLOW }}
            NEXT_PUBLIC_UMAMI_URL=${{ vars.NEXT_PUBLIC_UMAMI_URL }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
            API_PROXY_TARGET=http://backend:8787
          cache-from: type=gha,scope=plansync-frontend
          cache-to: type=gha,mode=max,scope=plansync-frontend

  build-backend:
    runs-on: ubuntu-latest
    needs: [check, changes]
    if: needs.changes.outputs.backend == 'true' || inputs.force_build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=production
            type=sha,format=long,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=plansync-backend
          cache-to: type=gha,mode=max,scope=plansync-backend

  deploy:
    runs-on: ubuntu-latest
    needs: [check, changes, build-frontend, build-backend]
    if: |
      always() &&
      needs.check.result == 'success' &&
      needs.changes.result == 'success' &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped') &&
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy)
      )
    steps:
      - name: Require Dokploy webhook secret
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_WEBHOOK" ]; then
            echo "Missing repository secret DOKPLOY_DEPLOY_WEBHOOK."
            echo "Add the Dokploy compose deploy webhook URL, then re-run this workflow."
            exit 1
          fi

      # Dokploy validates the webhook against a Git provider push payload and
      # rejects anything whose `ref` does not match the branch configured on the compose app.
      - name: Trigger Dokploy pull-and-restart
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
          DEPLOY_BRANCH: ${{ vars.DOKPLOY_DEPLOY_BRANCH || 'main' }}
        run: |
          set -eu
          payload=$(
            DEPLOY_SHA="${{ github.sha }}" \
            DEPLOY_REPO="${{ github.repository }}" \
            node -e '
              const branch = process.env.DEPLOY_BRANCH;
              const [owner, name] = process.env.DEPLOY_REPO.split("/");
              process.stdout.write(
                JSON.stringify({
                  ref: `refs/heads/${branch}`,
                  repository: {
                    name,
                    full_name: process.env.DEPLOY_REPO,
                    owner: { name: owner, login: owner },
                  },
                  head_commit: {
                    id: process.env.DEPLOY_SHA,
                    message: "Deploy prebuilt images from GitHub Actions",
                  },
                }),
              );
            '
          )
          status=$(
            curl --silent --show-error \
              --request POST \
              --max-time 120 \
              --header "Content-Type: application/json" \
              --header "x-github-event: push" \
              --data "$payload" \
              --output /tmp/dokploy-response.txt \
              --write-out '%{http_code}' \
              "$DOKPLOY_DEPLOY_WEBHOOK"
          )
          echo "Dokploy responded with HTTP $status"
          cat /tmp/dokploy-response.txt
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Dokploy rejected the deploy webhook."
            echo "Check that Auto Deploy is enabled and that the compose branch matches '$DEPLOY_BRANCH'."
            exit 1
          fi
